name: Netty

options:
  bundleIdPrefix: com.alvaldes
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"

packages:
  NettyKit:
    path: Packages/NettyKit

targets:
  Netty:
    type: application
    platform: macOS
    sources:
      - Netty
    dependencies:
      - package: NettyKit
    info:
      path: Netty/Resources/Info.plist
      properties:
        CFBundleDisplayName: Netty
        # XcodeGen otherwise writes 1.0 (1); the version lives in the build settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Netty contributors. GPL-3.0."
        NSLocationUsageDescription: "macOS shares the Wi-Fi network name only with apps that have Location access. Netty never reads your location."
        NSLocationWhenInUseUsageDescription: "macOS shares the Wi-Fi network name only with apps that have Location access. Netty never reads your location."
        # Apple's captive portal check is plain HTTP by design: a portal must be able to intercept it.
        NSAppTransportSecurity:
          NSExceptionDomains:
            captive.apple.com:
              NSExceptionAllowsInsecureHTTPLoads: true
    entitlements:
      path: Netty/Resources/Netty.entitlements
      properties:
        # Hardened runtime blocks Location Services, needed for the Wi-Fi name, without it.
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_NAME: Netty
        PRODUCT_BUNDLE_IDENTIFIER: com.alvaldes.netty
        # Netty/Resources/AppIcon.icon, made in Icon Composer.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Netty:
    build:
      targets:
        Netty: all
    run:
      config: Debug
